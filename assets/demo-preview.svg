<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">溜达喵演示视频封面</title>
  <desc id="desc">彩色地图路线背景，中央有播放按钮，点击后前往 B 站观看演示视频。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3ea"/>
      <stop offset=".52" stop-color="#eaf8ff"/>
      <stop offset="1" stop-color="#d9f8ef"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb8e89"/>
      <stop offset=".5" stop-color="#5bbaff"/>
      <stop offset="1" stop-color="#58d9bb"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#294760" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="32" fill="url(#bg)"/>
  <path d="M-40 385 C145 315 185 462 365 376 S625 218 785 308 990 324 1010 285" fill="none" stroke="#fff" stroke-width="74" opacity=".75"/>
  <path d="M-40 385 C145 315 185 462 365 376 S625 218 785 308 990 324 1010 285" fill="none" stroke="url(#accent)" stroke-width="13" stroke-linecap="round" stroke-dasharray="1 24"/>
  <circle cx="192" cy="366" r="21" fill="#fb8e89" stroke="#fff" stroke-width="8"/>
  <circle cx="785" cy="308" r="21" fill="#58d9bb" stroke="#fff" stroke-width="8"/>
  <rect x="95" y="72" width="770" height="394" rx="30" fill="#fff" opacity=".57" filter="url(#shadow)"/>
  <text x="480" y="187" fill="#304458" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="46" font-weight="700" text-anchor="middle">溜达喵 · 演示视频</text>
  <text x="480" y="233" fill="#62798a" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" text-anchor="middle">边聊天，边在地图上寻找想去的地方</text>
  <circle cx="480" cy="329" r="65" fill="#fff" filter="url(#shadow)"/>
  <circle cx="480" cy="329" r="55" fill="url(#accent)"/>
  <path d="M467 300 L467 358 L516 329 Z" fill="#fff"/>
  <text x="480" y="437" fill="#62798a" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" text-anchor="middle">点击播放 · Bilibili</text>
</svg>
